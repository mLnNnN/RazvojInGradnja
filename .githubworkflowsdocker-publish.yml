
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.miloradknezevic }}
          password: ${{ secrets.dckr_pat_v79HYxSCV5Qd2Jx_bL1d2HQrXDY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            miloradknezevic/feridockerci:latest
            miloradknezevic/feridockerci:${{ github.sha }}
